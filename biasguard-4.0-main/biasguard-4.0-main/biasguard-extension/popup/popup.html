<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiasGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Authentication Screen (shown when not logged in) -->
    <div id="authScreen" class="auth-screen" style="display: none;">
      <div class="auth-header">
        <img src="../assets/icon48.png" alt="BiasGuard" width="32" height="32">
        <h2>Welcome to BiasGuard</h2>
        <p>Sign in to access all features</p>
      </div>
      
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>
      
      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="auth-btn primary">Sign In</button>
        <div class="auth-error" id="loginError"></div>
      </form>
      
      <!-- Signup Form -->
      <form id="signupForm" class="auth-form" style="display: none;">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="signupName" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="••••••••" minlength="6" required>
        </div>
        <button type="submit" class="auth-btn primary">Sign Up</button>
        <div class="auth-error" id="signupError"></div>
      </form>
      
      <div class="auth-footer">
        <button id="skipAuth" class="auth-link">Continue as Guest</button>
      </div>
    </div>
    
    <!-- Main Screen (shown when logged in) -->
    <div id="mainScreen">
      <!-- Header -->
      <div class="header">
        <div class="logo">
          <img src="../assets/icon48.png" alt="BiasGuard" width="24" height="24">
          <h1>BiasGuard</h1>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div id="userInfo" class="user-info" style="display: none;">
            <span id="userName" style="font-size: 12px; color: #6b7280;"></span>
          </div>
          <label class="switch">
            <input type="checkbox" id="enableToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

    <!-- Status Card -->
    <div class="status-card">
      <div class="status-header">
        <h2>Current Page</h2>
        <div class="bias-indicator" id="pageIndicator">
          <span class="dot green"></span>
          <span class="text">Monitoring</span>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="number" id="textInputs">0</span>
          <span class="label">Inputs monitored</span>
        </div>
        <div class="stat">
          <span class="number" id="biasChecks">0</span>
          <span class="label">Checks today</span>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="action-btn primary" id="quickCheck">
        <span class="icon">🔍</span>
        <span>Quick Check</span>
      </button>
      <button class="action-btn secondary" id="openEditor">
        <span class="icon">✏️</span>
        <span>Editor</span>
      </button>
    </div>

    <!-- Settings -->
    <div class="settings">
      <h3 class="settings-title">Settings</h3>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="realTimeCheck" checked>
          <span>Real-time checking</span>
        </label>
      </div>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="showSuggestions" checked>
          <span>Show suggestions</span>
        </label>
      </div>
      <div class="setting-item">
        <label>
          <span>Check delay (ms)</span>
          <input type="number" id="checkDelay" value="1000" min="500" max="5000" step="100">
        </label>
      </div>
    </div>

      <!-- Footer -->
      <div class="footer">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <a href="#" id="openSettings">Advanced Settings</a>
          <div style="display: flex; align-items: center; gap: 12px;">
            <button id="logoutBtn" style="
              background: none;
              border: none;
              color: #6b7280;
              font-size: 12px;
              cursor: pointer;
              text-decoration: underline;
            ">Logout</button>
            <span class="version">v1.0.0</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
